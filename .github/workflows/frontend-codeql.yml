name: Frontend Unified Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests (if present)
        run: npm run test --if-present

      - name: Run build
        run: npm run build

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Detect Terraform directories
        id: tf-detect
        shell: bash
        run: |
          tf_dirs=$(find . -type f -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u)
          if [ -z "$tf_dirs" ]; then
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform files found. Terraform checks will be skipped."
            exit 0
          fi

          echo "has_tf=true" >> "$GITHUB_OUTPUT"
          {
            echo "tf_dirs<<EOF"
            echo "$tf_dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform fmt check
        if: steps.tf-detect.outputs.has_tf == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: steps.tf-detect.outputs.has_tf == 'true'
        shell: bash
        run: |
          while IFS= read -r dir; do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done <<< "${{ steps.tf-detect.outputs.tf_dirs }}"

      - name: TFLint
        if: steps.tf-detect.outputs.has_tf == 'true'
        shell: bash
        run: |
          tflint --init
          while IFS= read -r dir; do
            echo "Linting $dir"
            tflint --chdir="$dir"
          done <<< "${{ steps.tf-detect.outputs.tf_dirs }}"

      - name: Terraform checks skipped
        if: steps.tf-detect.outputs.has_tf != 'true'
        run: echo "Terraform checks skipped because this repository has no Terraform files."

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Dependency Graph support
        id: depgraph
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")

          if [ "$status" = "200" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "Dependency Graph is available."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "Dependency Graph not available for this repository (HTTP $status)."
          fi

      - name: Dependency review
        if: steps.depgraph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4

      - name: Dependency review skipped
        if: steps.depgraph.outputs.supported != 'true'
        run: echo "Skipping dependency review because Dependency Graph is unavailable for this repository."
